---
layout: default
---
<article class="wrap post">
  <header class="post-h">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      <span>{{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
      <span>CS 5976 directed study</span>
    </p>
  </header>
  <div class="prose">{{ content }}</div>
</article>
