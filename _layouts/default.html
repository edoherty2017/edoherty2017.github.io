<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{%- feed_meta -%}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <div class="masthead-in">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="tagline">{{ site.tagline }}</span>
  </div>
</header>
<main id="main">
{{ content }}
</main>
<footer class="siteft">
  <div class="siteft-in">
    <span>{{ site.title }}</span>
    <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a> &middot; <a href="https://github.com/edoherty2017">GitHub</a></span>
  </div>
</footer>
</body>
</html>
